[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cruise-lang"
version = "0.3.0"
authors = [
  { name = "Manjas Anand" }
]
description = "Cruise: An AI-powered, tensor-ready lightweight programming language interpreter."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "scikit-learn",
    "numpy",
    "requests"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://manjas-developer.github.io/Cruise-Website/"
Repository = "https://github.com/manjas-developer/Cruise"
"Support My Work" = "https://buymeachai.ezee.li/manjas_developer"

[project.scripts]
cruise = "main:main"

[tool.setuptools]
py-modules = ["main"]
